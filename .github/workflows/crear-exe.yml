name: Crear ejecutable de Windows

on:
  workflow_dispatch:      # botón "Run workflow" en GitHub
  push:
    branches: [main, master]

jobs:
  construir:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pyinstaller
      - run: python -m PyInstaller --onefile --windowed --name CalculadoraFinanciera app.py
      - uses: actions/upload-artifact@v4
        with:
          name: CalculadoraFinanciera-portable
          path: dist/CalculadoraFinanciera.exe
